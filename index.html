<title>老婆的小本本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Huninn&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app — sticker-style animal mascots, rounded "bubble" cards, bottom tab bar with a center add button. */
:root {
  --bg: #FFF5F3;
  --surface: #FFFFFF;
  --surface-2: #FFECEF;
  --ink: #4B3439;
  --ink-soft: #8E7379;
  --line: #F3D9DF;
  --accent: #FF6F91;
  --accent-ink: #FFFFFF;
  --sky: #A9D2FF;
  --peach: #FFC6A5;
  --pink: #FFB5C8;
  --lilac: #CDBDFA;
  --mint: #A8E3CF;
  --butter: #FFE08A;
  --danger: #E5546B;
  --shadow: 0 6px 18px rgba(214, 120, 140, .14);
  --font-body: "Huninn", "Zen Maru Gothic", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "Fredoka", "Huninn", system-ui, sans-serif;
  --r-lg: 22px;
  --r-md: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #231A1D; --surface: #32262A; --surface-2: #3E2E34; --ink: #FBEDEF; --ink-soft: #C8AEB4;
    --line: #4D3940; --accent: #FF8EA8; --accent-ink: #2A1A1F;
    --sky: #8DBDF0; --peach: #F0AE8C; --pink: #F29DB3; --lilac: #B3A2EC; --mint: #8CCDB7; --butter: #E9C96E;
    --danger: #FF7D90; --shadow: 0 6px 18px rgba(0,0,0,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #231A1D; --surface: #32262A; --surface-2: #3E2E34; --ink: #FBEDEF; --ink-soft: #C8AEB4;
  --line: #4D3940; --accent: #FF8EA8; --accent-ink: #2A1A1F;
  --sky: #8DBDF0; --peach: #F0AE8C; --pink: #F29DB3; --lilac: #B3A2EC; --mint: #8CCDB7; --butter: #E9C96E;
  --danger: #FF7D90; --shadow: 0 6px 18px rgba(0,0,0,.35); color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
.app {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(110px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
h1, h2, h3 { margin: 0; text-wrap: balance; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* hero */
.hero { display: flex; align-items: center; gap: 12px; }
.hero h1 { font-size: 1.6rem; letter-spacing: .02em; }
.hero p { margin: 2px 0 0; color: var(--ink-soft); font-size: .9rem; }
.hero .stack { display: flex; }
.hero .stack .m { margin-left: -12px; }
.hero .stack .m:first-child { margin-left: 0; }
.hero-text { min-width: 0; flex: 1; }
.cloud-pill { font-size: .72rem; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--ink-soft); white-space: nowrap; }
.cloud-pill.ok::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #4CC38A; margin-right: 5px; vertical-align: 1px; }
.cloud-pill.off::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--butter); margin-right: 5px; vertical-align: 1px; }

/* mascots */
.m { flex: none; display: inline-grid; place-items: center; border-radius: 50%; }
.m svg { width: 100%; height: 100%; display: block; }

/* search */
.search { position: relative; }
.search input {
  width: 100%; border: 2px solid var(--line); background: var(--surface); border-radius: 99px;
  padding: 11px 16px 11px 42px; outline: none; transition: border-color .15s;
}
.search input:focus { border-color: var(--accent); }
.search svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--ink-soft); }

/* quick actions */
.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.qa {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 6px 10px;
  border-radius: var(--r-md); background: var(--surface); border: 2px solid var(--line); text-align: center;
  font-size: .85rem; transition: transform .12s;
}
.qa:active { transform: scale(.96); }
.qa small { color: var(--ink-soft); font-size: .72rem; }

/* section */
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-head h2 { font-size: 1.08rem; }
.sec-head button { color: var(--accent); font-size: .85rem; }
.section { display: flex; flex-direction: column; gap: 10px; }

/* categories */
.cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.cat-tile {
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 6px 12px;
  border-radius: var(--r-lg); background: color-mix(in srgb, var(--c) 30%, var(--surface)); text-align: center;
  transition: transform .12s;
}
.cat-tile:active { transform: scale(.96); }
.cat-tile b { font-size: .88rem; font-weight: normal; }
.cat-tile span { font-size: .75rem; color: var(--ink-soft); }

/* countdown */
.dates { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.date-card {
  flex: none; min-width: 150px; padding: 12px 14px; border-radius: var(--r-md);
  background: color-mix(in srgb, var(--butter) 40%, var(--surface)); text-align: left;
  display: flex; flex-direction: column; gap: 2px;
}
.date-card .d { font-family: var(--font-num); font-size: 1.6rem; font-weight: 700; line-height: 1.1; }
.date-card .d small { font-size: .8rem; font-family: var(--font-body); font-weight: normal; margin-left: 3px; }
.date-card .t { font-size: .85rem; }
.date-card .s { font-size: .72rem; color: var(--ink-soft); }

/* banner */
.banner {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-md);
  background: var(--surface-2); font-size: .84rem;
}
.banner p { margin: 0; flex: 1; min-width: 0; }
.banner button { color: var(--accent); white-space: nowrap; font-size: .84rem; }

/* cards */
.list { display: flex; flex-direction: column; gap: 10px; }
.card {
  display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: var(--r-md);
  background: var(--surface); box-shadow: var(--shadow); text-align: left; width: 100%;
  border: 2px solid transparent; transition: transform .12s;
}
.card:active { transform: scale(.985); }
.card.done { opacity: .72; }
.card.done .card-title { text-decoration: line-through; text-decoration-color: var(--accent); text-decoration-thickness: 2px; }
.card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.card-title { font-size: 1rem; overflow-wrap: anywhere; }
.card-note { font-size: .82rem; color: var(--ink-soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-size: .72rem; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-soft);
  display: inline-flex; align-items: center; gap: 4px; max-width: 100%;
}
.chip.ex { background: var(--butter); color: #5B4513; }
.chip.bad { background: color-mix(in srgb, var(--danger) 18%, var(--surface)); color: var(--danger); }
.chip.map { background: color-mix(in srgb, var(--sky) 35%, var(--surface)); color: var(--ink); text-decoration: none; }
.chip svg { width: 12px; height: 12px; flex: none; }
.thumb { width: 54px; height: 54px; border-radius: 12px; object-fit: cover; flex: none; background: var(--surface-2); }
.check {
  flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--line);
  display: grid; place-items: center; background: var(--surface); transition: background .15s, border-color .15s;
}
.check svg { width: 16px; height: 16px; opacity: 0; color: var(--accent-ink); }
.check.on { background: var(--accent); border-color: var(--accent); }
.check.on svg { opacity: 1; }
.hearts { color: var(--accent); font-size: .78rem; letter-spacing: 1px; }

/* view head */
.vhead { display: flex; align-items: center; gap: 10px; }
.vhead h1 { font-size: 1.35rem; }
.vhead p { margin: 0; color: var(--ink-soft); font-size: .84rem; }
.back { width: 38px; height: 38px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; box-shadow: var(--shadow); flex: none; }
.back svg { width: 18px; height: 18px; }
.seg { display: flex; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 99px; }
.seg button { flex: 1; padding: 7px 10px; border-radius: 99px; font-size: .84rem; color: var(--ink-soft); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 2px 6px rgba(0,0,0,.08); }

/* progress */
.progress-card { display: flex; gap: 16px; align-items: center; padding: 16px; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow); }
.ring { position: relative; width: 92px; height: 92px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .lbl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.1; }
.ring .lbl b { font-family: var(--font-num); font-size: 1.4rem; }
.ring .lbl small { display: block; font-size: .68rem; color: var(--ink-soft); }
.bars { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 3.2em 1fr auto; gap: 8px; align-items: center; font-size: .8rem; }
.bar { height: 9px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--c); transition: width .4s; }

/* memories */
.gallery { columns: 2; column-gap: 10px; }
.gallery button { display: block; width: 100%; margin-bottom: 10px; break-inside: avoid; position: relative; border-radius: var(--r-md); overflow: hidden; box-shadow: var(--shadow); background: var(--surface); text-align: left; }
.gallery img { display: block; width: 100%; height: auto; }
.gallery .cap { padding: 8px 10px; font-size: .8rem; }
.gallery .cap small { display: block; color: var(--ink-soft); font-size: .7rem; }

/* empty */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 28px 16px; color: var(--ink-soft); background: var(--surface); border-radius: var(--r-lg); border: 2px dashed var(--line); }
.empty b { color: var(--ink); font-weight: normal; font-size: 1rem; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 18px; border-radius: 99px;
  background: var(--accent); color: var(--accent-ink); font-size: .92rem; text-decoration: none; transition: transform .12s;
}
.btn:active { transform: scale(.96); }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.danger { background: var(--danger); color: #fff; }
.btn svg { width: 17px; height: 17px; }

/* tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); padding-top: 8px;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
}
.tabbar nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .7rem; color: var(--ink-soft); padding: 4px 0; }
.tab svg { width: 24px; height: 24px; }
.tab.on { color: var(--accent); }
.fab {
  justify-self: center; width: 58px; height: 58px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; margin-top: -26px; box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 45%, transparent);
  border: 4px solid var(--bg); transition: transform .12s;
}
.fab:active { transform: scale(.92); }
.fab svg { width: 26px; height: 26px; }

/* sheet */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(60, 30, 40, .38); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s; }
.sheet {
  width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--bg);
  border-radius: 26px 26px 0 0; animation: up .24s cubic-bezier(.2,.9,.3,1.2);
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  padding-block: 10px calc(24px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.grab { width: 44px; height: 5px; border-radius: 9px; background: var(--line); align-self: center; }
.sheet-head { display: flex; align-items: center; gap: 10px; }
.sheet-head h2 { flex: 1; min-width: 0; font-size: 1.2rem; overflow-wrap: anywhere; }
.x { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; flex: none; }
.x svg { width: 16px; height: 16px; }
@keyframes up { from { transform: translateY(40%); opacity: .4; } }
@keyframes fade { from { opacity: 0; } }

/* form */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .lab { font-size: .82rem; color: var(--ink-soft); }
.field input[type=text], .field input[type=url], .field input[type=date], .field input[type=number], .field textarea {
  width: 100%; border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 12px; outline: none;
}
.field textarea { min-height: 84px; resize: vertical; }
.field input:focus, .field textarea:focus { border-color: var(--accent); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cat-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cat-pick button { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 14px; background: var(--surface); border: 2px solid var(--line); font-size: .8rem; text-align: left; }
.cat-pick button.on { border-color: var(--accent); background: color-mix(in srgb, var(--c) 35%, var(--surface)); }
.prio { display: flex; gap: 6px; }
.prio button { width: 40px; height: 40px; border-radius: 12px; background: var(--surface); border: 2px solid var(--line); display: grid; place-items: center; color: var(--line); }
.prio button.on { color: var(--accent); border-color: var(--accent); }
.prio svg { width: 20px; height: 20px; }
.toggle { display: flex; align-items: center; gap: 8px; font-size: .88rem; cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
.sheet-actions { display: flex; gap: 10px; }
.sheet-actions .btn { flex: 1; }
.hint { font-size: .74rem; color: var(--ink-soft); }

/* detail */
.detail-meta { display: flex; flex-direction: column; gap: 10px; background: var(--surface); padding: 14px; border-radius: var(--r-md); }
.kv { display: grid; grid-template-columns: 4.5em 1fr; gap: 8px; font-size: .9rem; }
.kv span:first-child { color: var(--ink-soft); }
.kv span:last-child { min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.kv a { color: var(--accent); }
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.photos .ph { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 14px; overflow: hidden; background: var(--surface-2); }
.photos .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photos .ph .rm { position: absolute; top: 5px; right: 5px; width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,.5); color: #fff; display: grid; place-items: center; }
.photos .ph .rm svg { width: 12px; height: 12px; }
.photos .add { aspect-ratio: 1; border-radius: 14px; border: 2px dashed var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--ink-soft); font-size: .75rem; background: var(--surface); }
.photos .add svg { width: 24px; height: 24px; }
.done-bar { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-md); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.done-bar p { margin: 0; flex: 1; font-size: .9rem; }
.done-bar small { display: block; color: var(--ink-soft); font-size: .75rem; }
.confirm { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: var(--r-md); background: color-mix(in srgb, var(--danger) 12%, var(--surface)); font-size: .88rem; }

/* lightbox */
.lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(20,10,14,.92); display: grid; place-items: center; padding: 20px; animation: fade .18s; }
.lightbox img { max-width: 100%; max-height: 86vh; border-radius: 14px; }

/* toast */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 70;
  bottom: calc(96px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: .86rem;
  display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow); animation: up .25s;
}
.toast button { color: var(--pink); white-space: nowrap; }

/* confetti */
.confetti { position: fixed; z-index: 80; pointer-events: none; width: 22px; height: 22px; animation: pop 1.1s ease-out forwards; }
@keyframes pop {
  0% { transform: translate(0,0) scale(.4) rotate(0); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) scale(1.1) rotate(var(--rot)); opacity: 0; }
}
.loading { text-align: center; color: var(--ink-soft); padding: 40px 0; }
.bounce { animation: bob 1.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (max-width: 360px) { .cats, .quick { grid-template-columns: repeat(2, 1fr); } }
</style>

function mascot(animal, size = 44, bg = '') {
  return `<span class="m" style="width:${size}px;height:${size}px;${bg ? `background:${bg};padding:${Math.round(size * .08)}px` : ''}" aria-hidden="true"><svg viewBox="0 0 64 64">${ART[animal]}</svg></span>`;
}
const catMascot = (k, size = 44) => mascot(CATS[k].animal, size, `color-mix(in srgb, ${CATS[k].c} 55%, var(--surface))`);

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const photoUrl = id => '/_blob/' + id;
const safeUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; } };
const mapsUrl = it => {
  if (it.link && /google\.[^/]+\/maps|maps\.app\.goo\.gl|goo\.gl\/maps/.test(it.link)) return safeUrl(it.link);
  const q = (it.location || '').trim() || it.title;
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
};
const fmtDate = ts => { if (!ts) return ''; const d = new Date(ts); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`; };
const hearts = n => n ? '♥'.repeat(n) : '';
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

/* ---------- store (cloud db, with local fallback) ---------- */
const state = {
  items: new Map(), ready: false, cloud: false, assets: null,
  view: 'home', cat: null, filter: 'todo', query: '',
  sheet: null, draft: null, confirmDel: false, toast: null, uploading: 0,
};
let col = null;

async function initStore() {
  const fallbackTimer = setTimeout(() => { if (!state.ready) useLocal(); }, 10000);
  let db = null;
  try { db = window.claude?.use ? await window.claude.use('db') : null; } catch { db = null; }
  if (!db) { clearTimeout(fallbackTimer); useLocal(); return; }
  col = db.collection('items');
  col.onSnapshot(snap => {
    clearTimeout(fallbackTimer);
    state.items = new Map(snap.docs.map(d => [d.id, { ...d.data(), id: d.id }]));
    state.cloud = true; state.ready = true; render();
  }, err => {
    clearTimeout(fallbackTimer);
    if (!state.ready) useLocal();
    toast('雲端連線出了點狀況：' + (err?.message || '請稍後再試'));
  });
  try { state.assets = window.claude?.use ? await window.claude.use('assets') : null; } catch { state.assets = null; }
  render();
}
function useLocal() {
  col = null; state.cloud = false; state.ready = true;
  state.items = new Map(lsGet('wifenotes.items', []).map(i => [i.id, i]));
  render();
}
function persistLocal() { lsSet('wifenotes.items', [...state.items.values()]); }

async function saveItem(item) {
  const clean = JSON.parse(JSON.stringify(item)); delete clean.id;
  state.items.set(item.id, item); render();
  if (col) { try { await col.doc(item.id).set(clean); } catch (e) { toast(saveErr(e)); } }
  else persistLocal();
}
async function patchItem(id, patch) {
  const it = state.items.get(id); if (!it) return;
  const next = { ...it, ...patch, updatedAt: Date.now() };
  state.items.set(id, next); render();
  if (col) { try { await col.doc(id).update({ ...patch, updatedAt: next.updatedAt }); } catch (e) { toast(saveErr(e)); } }
  else persistLocal();
}
async function removeItem(id) {
  const it = state.items.get(id);
  state.items.delete(id); render();
  if (col) { try { await col.doc(id).delete(); } catch (e) { toast(saveErr(e)); } }
  else persistLocal();
  if (it?.photos?.length && state.assets) for (const p of it.photos) state.assets.delete(p).catch(() => {});
}
const saveErr = e => e?.code === 'quota_exceeded' ? '雲端空間滿了，刪掉一些舊項目再試試' :
  e?.code === 'not_granted' ? '沒有編輯權限，請用擁有者帳號開啟' : '沒存成功，請檢查網路後再試一次';

/* ---------- derived ---------- */
const all = () => [...state.items.values()].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
const byCat = k => all().filter(i => i.cat === k);
const matches = (i, q) => {
  q = q.trim().toLowerCase(); if (!q) return true;
  if (q.startsWith('#')) return (i.tags || []).some(t => t.toLowerCase() === q.slice(1));
  return [i.title, i.note, i.location, ...(i.tags || []), CATS[i.cat]?.name].join(' ').toLowerCase().includes(q);
};
function upcoming() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return all().filter(i => i.date).map(i => {
    const [y, m, d] = i.date.split('-').map(Number);
    let next = new Date(y, m - 1, d);
    if (i.yearly) { next = new Date(today.getFullYear(), m - 1, d); if (next < today) next.setFullYear(today.getFullYear() + 1); }
    const days = Math.round((next - today) / 864e5);
    const years = i.yearly ? next.getFullYear() - y : 0;
    return { it: i, days, next, years };
  }).filter(x => x.days >= 0 && x.days <= 366).sort((a, b) => a.days - b.days);
}

/* ---------- render ---------- */
function render() {
  renderTabs();
  const app = $('#app');
  if (!state.ready) { app.innerHTML = `<div class="loading"><div class="bounce">${mascot('bunny', 64)}</div>小本本打開中…</div>`; return; }
  const v = state.view;
  app.innerHTML = v === 'wish' ? viewWish() : v === 'memories' ? viewMemories() : v === 'profile' ? viewProfile()
    : v === 'cat' ? viewCat() : viewHome();
  const s = $('#q'); if (s) { s.value = state.query; }
  renderLayer();
}

function renderTabs() {
  const t = (v, icon, label) => `<button class="tab ${state.view === v || (v === 'home' && state.view === 'cat') ? 'on' : ''}" data-act="nav" data-v="${v}">${icon}<span>${label}</span></button>`;
  $('#tabs').innerHTML = t('home', I.home, '首頁') + t('wish', I.star, '心願清單') +
    `<button class="fab" data-act="add" aria-label="新增一筆">${I.plus}</button>` +
    t('memories', I.photo, '回憶牆') + t('profile', I.heartBook, '她的檔案');
}

function card(i, opts = {}) {
  const c = CATS[i.cat] || CATS.like;
  const thumb = i.photos?.length ? `<img class="thumb" src="${photoUrl(i.photos[0])}" alt="" loading="lazy">` : catMascot(i.cat, 44);
  const chips = [];
  if (i.example) chips.push('<span class="chip ex">範例</span>');
  if (opts.showCat) chips.push(`<span class="chip">${c.short}</span>`);
  if (i.mood === 'dislike') chips.push('<span class="chip bad">地雷</span>');
  if (i.location && (i.cat === 'place' || i.cat === 'food' || i.cat === 'gift'))
    chips.push(`<a class="chip map" href="${esc(mapsUrl(i))}" target="_blank" rel="noopener" data-stop>${I.pin}${esc(i.location)}</a>`);
  if (i.price) chips.push(`<span class="chip num">$${esc(i.price)}</span>`);
  if (i.date) chips.push(`<span class="chip num">${esc(i.date.replace(/-/g, '/'))}${i.yearly ? ' · 每年' : ''}</span>`);
  if (i.photos?.length > 1) chips.push(`<span class="chip">${I.photo}${i.photos.length}</span>`);
  (i.tags || []).slice(0, 3).forEach(t => chips.push(`<span class="chip">#${esc(t)}</span>`));
  const checkbox = c.wish ? `<button class="check ${i.done ? 'on' : ''}" data-act="toggle" data-id="${i.id}" aria-label="${i.done ? '改回未完成' : '標記完成'}" data-stop>${I.check}</button>` : '';
  return `<div class="card ${i.done ? 'done' : ''}" role="button" tabindex="0" data-act="open" data-id="${i.id}">
    ${thumb}
    <div class="card-body">
      <div class="card-title">${esc(i.title)} ${i.priority ? `<span class="hearts">${hearts(i.priority)}</span>` : ''}</div>
      ${i.note ? `<div class="card-note">${esc(i.note)}</div>` : ''}
      ${chips.length ? `<div class="chips">${chips.join('')}</div>` : ''}
    </div>
    ${checkbox}
  </div>`;
}

}

function viewCat() {

/* ---------- photos ---------- */
async function compress(file) {
  if (!/^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type) && file.type) return { blob: file, type: file.type };
  try {
    const bmp = await createImageBitmap(file);
    const max = 1600, s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', .85));
    return blob ? { blob, type: 'image/jpeg' } : { blob: file, type: file.type || 'image/jpeg' };
  } catch { return { blob: file, type: file.type || 'image/jpeg' }; }
}
let uploadTarget = null;
$('#file').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  const id = uploadTarget; if (!id || !files.length || !state.assets) return;
  state.uploading += files.length; renderLayer();
  const added = [];
  for (const f of files) {
    try {
      const { blob, type } = await compress(f);
      const res = await state.assets.upload(blob, { type });
      added.push(res.id);
    } catch (err) {
      toast(err?.code === 'quota_exceeded' ? '照片空間滿了，刪掉一些舊照片再試' : err?.code === 'unsupported_type' ? '這個檔案格式不支援，換成 JPG 或 PNG 試試' : '有照片沒上傳成功，請再試一次');
    }
    state.uploading--; renderLayer();
  }
  if (added.length) {
    const it = state.items.get(id);
    await patchItem(id, { photos: [...(it?.photos || []), ...added] });
    toast(`放好 ${added.length} 張照片了`);
  }
});

/* ---------- toast & confetti ---------- */
let toastTimer;
function toast(text, action, label, id) {
  state.toast = { text, action, label, id }; renderLayer();
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { state.toast = null; renderLayer(); }, action ? 5000 : 2600);
}
function celebrate(x, y) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['var(--accent)', 'var(--sky)', 'var(--butter)', 'var(--mint)', 'var(--lilac)', 'var(--peach)'];
  for (let n = 0; n < 16; n++) {
    const el = document.createElement('span');
    el.className = 'confetti';
    el.innerHTML = n % 2 ? I.heart : I.paw;
    el.style.cssText = `left:${x - 11}px;top:${y - 11}px;color:${colors[n % colors.length]};--dx:${(Math.random() - .5) * 220}px;--dy:${-60 - Math.random() * 160}px;--rot:${(Math.random() - .5) * 120}deg`;
    document.body.appendChild(el); setTimeout(() => el.remove(), 1200);
  }
}

/* ---------- navigation ---------- */
function go(view, cat) {
  state.view = view; state.cat = cat || null; state.filter = 'todo'; state.query = view === 'home' ? state.query : '';
  const h = view === 'cat' ? 'cat-' + cat : view;
  if (location.hash.slice(1) !== h) { try { history.pushState(null, '', '#' + h); } catch { location.hash = h; } }
  render(); window.scrollTo(0, 0);
}
function fromHash() {
  const h = location.hash.slice(1);
  if (h.startsWith('cat-') && (CATS[h.slice(4)] || h === 'cat-giftMode')) { state.view = 'cat'; state.cat = h.slice(4); }
  else if (['home', 'wish', 'memories', 'profile'].includes(h)) { state.view = h; state.cat = null; }
  else { state.view = 'home'; state.cat = null; }
}
window.addEventListener('hashchange', () => { fromHash(); render(); });
window.addEventListener('popstate', () => { fromHash(); render(); });

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const stopEl = e.target.closest('[data-stop]');
  const el = e.target.closest('[data-act]');
  if (!el) return;
  // clicks inside a sheet should not bubble to the overlay's close action
  if (el.dataset.act === 'close' && el.classList.contains('overlay') && e.target !== el) return;
  // links inside cards: let them navigate without opening the card
  if (e.target.closest('a[href]') && el.dataset.act === 'open') return;
  if (stopEl && el !== stopEl && el.contains(stopEl) && !stopEl.dataset.act) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'nav': go(el.dataset.v); break;
    case 'openCat': go('cat', el.dataset.cat); break;
    case 'giftMode': go('cat', 'giftMode'); break;
    case 'filter': state.filter = el.dataset.f; render(); break;
    case 'add': {
      let cat = el.dataset.cat || (state.view === 'cat' && CATS[state.cat] ? state.cat : state.view === 'profile' ? 'info' : 'place');
      openForm({ cat, title: el.dataset.title || '' }); break;
    }
    case 'open': state.sheet = { mode: 'view', id }; state.confirmDel = false; renderLayer(); break;
    case 'close': if (state.sheet?.mode === 'form' && state.draft?.id) { state.sheet = { mode: 'view', id: state.draft.id }; state.draft = null; } else { state.sheet = null; state.draft = null; } renderLayer(); break;
    case 'toggle': {
      e.stopPropagation();
      const it = state.items.get(id); if (!it) break;
      const done = !it.done;
      patchItem(id, { done, doneAt: done ? Date.now() : null });
      if (done) {
        const r = el.getBoundingClientRect(); celebrate(r.left + r.width / 2, r.top + r.height / 2);
        if (state.assets) toast('完成一個心願！要放張照片嗎？', 'upload', '上傳照片', id); else toast('完成一個心願！');
      }
      break;
    }
    case 'edit': { const it = state.items.get(id); openForm({ ...it, tags: [...(it.tags || [])] }); break; }
    case 'askDel': state.confirmDel = true; renderLayer(); break;
    case 'cancelDel': state.confirmDel = false; renderLayer(); break;
    case 'del': removeItem(id); state.sheet = null; state.confirmDel = false; renderLayer(); toast('已刪除'); break;
    case 'pickCat': readForm(); state.draft.cat = el.dataset.cat; renderLayer(); break;
    case 'prio': readForm(); { const n = +el.dataset.n; state.draft.priority = state.draft.priority === n ? n - 1 : n; } renderLayer(); break;
    case 'mood': readForm(); state.draft.mood = el.dataset.m; renderLayer(); break;
    case 'upload': uploadTarget = id; state.toast = null; $('#file').click(); break;
    case 'rmPhoto': {
      const it = state.items.get(id); const p = el.dataset.p;
      patchItem(id, { photos: (it.photos || []).filter(x => x !== p) });
      state.assets?.delete(p).catch(() => {});
      break;
    }
    case 'light': state.lightbox = el.dataset.p; renderLayer(); break;
    case 'closeLight': state.lightbox = null; renderLayer(); break;
    case 'tag': state.sheet = null; state.query = '#' + el.dataset.t; go('home'); break;
    case 'random': {
      const pool = byCat(el.dataset.cat).filter(i => !i.done);
      if (!pool.length) { toast(`「${CATS[el.dataset.cat].name}」還沒有未完成的項目`, 'add', '去新增'); break; }
      const pick = pool[Math.floor(Math.random() * pool.length)];
      const r = el.getBoundingClientRect(); celebrate(r.left + r.width / 2, r.top + 20);
      state.sheet = { mode: 'view', id: pick.id }; renderLayer(); break;
    }
    case 'clearEx': {
      if (!state.confirmClear) { state.confirmClear = true; render(); setTimeout(() => { state.confirmClear = false; render(); }, 4000); break; }
      state.confirmClear = false;
      all().filter(i => i.example).forEach(i => removeItem(i.id));
      toast('範例都清掉了，開始記錄吧'); break;
    }
  }
});
document.addEventListener('submit', e => { e.preventDefault(); submitForm(); });
document.addEventListener('input', e => {
  if (e.target.id === 'q') { state.query = e.target.value; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (state.lightbox) { state.lightbox = null; } else if (state.sheet) { state.sheet = null; state.draft = null; } renderLayer(); }
  if (e.key === 'Enter' && e.target.classList?.contains('card') ) e.target.click();
});

// keep results rendering in sync when search typed and the full view would hide quick sections
const origRender = render;
render = function () {
  const q = $('#q'); const focused = document.activeElement === q; const pos = q?.selectionStart;
  origRender();
  if (focused) { const nq = $('#q'); if (nq) { nq.focus(); try { nq.setSelectionRange(pos, pos); } catch {} } }
};

fromHash();
render();
initStore();
})();
</script>
